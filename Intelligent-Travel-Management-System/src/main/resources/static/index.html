<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 4: Intelligent Decision — Personalized Travel Recommendation Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & Babel CDN for standalone Electron / Web serving -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: rgba(20, 27, 45, 0.75);
            --bg-card-hover: rgba(28, 38, 65, 0.9);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-active: rgba(99, 102, 241, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-cyan: #06b6d4;
            --accent-indigo: #6366f1;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --glow-indigo: rgba(99, 102, 241, 0.25);
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.10) 0%, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px 20px;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 36px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #818cf8;
            margin-bottom: 8px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 4px;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 460px 1fr;
            gap: 32px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* Presets Bar */
        .presets-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .preset-btn:hover {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.4);
            color: #c7d2fe;
            transform: translateY(-1px);
        }

        /* Form Inputs */
        .form-section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 20px 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-row-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-input {
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--accent-indigo);
            box-shadow: 0 0 0 3px var(--glow-indigo);
        }

        /* Sliders */
        .slider-group {
            margin-bottom: 14px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .slider-title {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .slider-value {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.12);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .slider-input {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #6366f1);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
            transition: transform 0.1s ease;
        }

        .slider-input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            border: none;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.6);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Results Panel */
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .results-title {
            font-size: 22px;
            font-weight: 700;
        }

        .results-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Recommendation Cards */
        .recommendation-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .recommendation-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .recommendation-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--border-color);
            transition: all 0.3s ease;
        }

        .recommendation-card.rank-1::before {
            background: linear-gradient(to bottom, #f59e0b, #e11d48);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
        }

        .recommendation-card.rank-2::before {
            background: linear-gradient(to bottom, #06b6d4, #6366f1);
        }

        .recommendation-card.rank-3::before {
            background: linear-gradient(to bottom, #10b981, #06b6d4);
        }

        .recommendation-card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.4);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .dest-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-pill {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .rank-1 .rank-pill {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .dest-name {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .dest-province {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: 4px;
        }

        .score-badge {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .score-pct {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--accent-cyan);
            line-height: 1;
        }

        .score-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        /* Suitability Badge */
        .suitability-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
            margin-bottom: 12px;
        }

        .badge-EXCELLENT_FIT {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-MODERATE_FIT {
            background: rgba(6, 182, 212, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .badge-CHALLENGING_FIT {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Reason Box */
        .reason-box {
            background: rgba(11, 15, 25, 0.6);
            border-left: 3px solid var(--accent-indigo);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        /* Compatibility Specs */
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        @media (max-width: 640px) {
            .specs-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .spec-label {
            color: var(--text-muted);
            font-size: 11px;
        }

        .spec-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* State Banners */
        .error-banner {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fda4af;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        /* Loading Skeleton */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const PERSONA_PRESETS = [
            {
                name: "🏔️ Adventure Trekker",
                data: { budget: 700, durationDays: 5, groupSize: 2, beach: 2, adventure: 9, nature: 10, culture: 4, nightlife: 3, relaxation: 5 }
            },
            {
                name: "🏖️ Coastal & Nightlife",
                data: { budget: 850, durationDays: 5, groupSize: 4, beach: 10, adventure: 6, nature: 6, culture: 3, nightlife: 9, relaxation: 8 }
            },
            {
                name: "🏛️ Cultural Heritage",
                data: { budget: 600, durationDays: 4, groupSize: 2, beach: 1, adventure: 4, nature: 6, culture: 10, nightlife: 2, relaxation: 6 }
            },
            {
                name: "✨ Luxury & Wellness",
                data: { budget: 1800, durationDays: 6, groupSize: 2, beach: 8, adventure: 3, nature: 6, culture: 4, nightlife: 4, relaxation: 10 }
            }
        ];

        function TravelerRecommendationApp() {
            const [formData, setFormData] = useState({
                budget: 800,
                durationDays: 5,
                groupSize: 2,
                beachPreference: 3,
                adventurePreference: 9,
                naturePreference: 8,
                culturePreference: 6,
                nightlifePreference: 4,
                relaxationPreference: 5
            });

            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [response, setResponse] = useState(null);

            const handleInputChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            const applyPreset = (preset) => {
                setFormData({
                    budget: preset.data.budget,
                    durationDays: preset.data.durationDays,
                    groupSize: preset.data.groupSize,
                    beachPreference: preset.data.beach,
                    adventurePreference: preset.data.adventure,
                    naturePreference: preset.data.nature,
                    culturePreference: preset.data.culture,
                    nightlifePreference: preset.data.nightlife,
                    relaxationPreference: preset.data.relaxation
                });
                setError(null);
            };

            const handleSubmit = async (e) => {
                if (e) e.preventDefault();
                setLoading(true);
                setError(null);

                try {
                    const res = await fetch('/api/decisions/recommend', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            budget: parseFloat(formData.budget),
                            durationDays: parseInt(formData.durationDays, 10),
                            groupSize: parseInt(formData.groupSize, 10),
                            beachPreference: parseInt(formData.beachPreference, 10),
                            adventurePreference: parseInt(formData.adventurePreference, 10),
                            naturePreference: parseInt(formData.naturePreference, 10),
                            culturePreference: parseInt(formData.culturePreference, 10),
                            nightlifePreference: parseInt(formData.nightlifePreference, 10),
                            relaxationPreference: parseInt(formData.relaxationPreference, 10),
                            topN: 5
                        })
                    });

                    const json = await res.json();

                    if (!res.ok || !json.success) {
                        throw new Error(json.message || `Server error: ${res.status}`);
                    }

                    setResponse(json.data);
                } catch (err) {
                    setError(err.message || "Failed to generate recommendations. Please check API connectivity.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="container">
                    <header className="app-header">
                        <div>
                            <div className="logo-badge">
                                <span>⚡ Module 4 Subsystem</span>
                                <span>•</span>
                                <span>Supabase PostgreSQL + Java ML</span>
                            </div>
                            <h1 className="header-title">Personalized Travel Recommendation Engine</h1>
                            <p className="header-subtitle">Decision Tree Suitability + k-NN Collaborative Filtering + Multi-Criteria Ranking</p>
                        </div>
                    </header>

                    <div className="main-grid">
                        {/* Left Column: Traveler Profile Form */}
                        <div className="glass-card">
                            <div className="presets-title">Quick Persona Presets</div>
                            <div className="presets-grid">
                                {PERSONA_PRESETS.map((p, idx) => (
                                    <button key={idx} className="preset-btn" onClick={() => applyPreset(p)}>
                                        {p.name}
                                    </button>
                                ))}
                            </div>

                            <form onSubmit={handleSubmit}>
                                <div className="form-section-title">
                                    <span>🧭</span> Trip Constraints
                                </div>

                                <div className="input-row-3">
                                    <div className="form-group">
                                        <label className="form-label">Budget ($)</label>
                                        <input
                                            type="number"
                                            className="form-input"
                                            min="0"
                                            step="10"
                                            value={formData.budget}
                                            onChange={e => handleInputChange('budget', e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Duration (Days)</label>
                                        <input
                                            type="number"
                                            className="form-input"
                                            min="1"
                                            max="14"
                                            value={formData.durationDays}
                                            onChange={e => handleInputChange('durationDays', e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Group Size</label>
                                        <input
                                            type="number"
                                            className="form-input"
                                            min="1"
                                            max="10"
                                            value={formData.groupSize}
                                            onChange={e => handleInputChange('groupSize', e.target.value)}
                                            required
                                        />
                                    </div>
                                </div>

                                <div className="form-section-title">
                                    <span>🎯</span> Travel Preferences (1 - 10)
                                </div>

                                {[
                                    { key: 'adventurePreference', label: 'Adventure & Trekking', icon: '🧗' },
                                    { key: 'naturePreference', label: 'Nature & Wildlife', icon: '🌿' },
                                    { key: 'beachPreference', label: 'Beach & Coastal', icon: '🏖️' },
                                    { key: 'culturePreference', label: 'Cultural Heritage & History', icon: '🏛️' },
                                    { key: 'nightlifePreference', label: 'Nightlife & Social', icon: '🍸' },
                                    { key: 'relaxationPreference', label: 'Relaxation & Wellness', icon: '🧘' }
                                ].map(item => (
                                    <div className="slider-group" key={item.key}>
                                        <div className="slider-header">
                                            <span className="slider-title">{item.icon} {item.label}</span>
                                            <span className="slider-value">{formData[item.key]} / 10</span>
                                        </div>
                                        <input
                                            type="range"
                                            className="slider-input"
                                            min="1"
                                            max="10"
                                            value={formData[item.key]}
                                            onChange={e => handleInputChange(item.key, e.target.value)}
                                        />
                                    </div>
                                ))}

                                <button type="submit" className="submit-btn" disabled={loading}>
                                    {loading ? <div className="spinner" /> : "⚡ Generate Recommendations"}
                                </button>
                            </form>
                        </div>

                        {/* Right Column: Recommendations Results */}
                        <div>
                            {error && (
                                <div className="error-banner">
                                    <strong>Error:</strong> {error}
                                </div>
                            )}

                            {!response && !loading && !error && (
                                <div className="glass-card empty-state">
                                    <div className="empty-icon">📍</div>
                                    <h3>Ready to Recommend</h3>
                                    <p style={{ marginTop: '8px', color: 'var(--text-secondary)', fontSize: '14px' }}>
                                        Adjust your budget, duration, and preferences on the left, then click <strong>Generate Recommendations</strong> to execute the Decision Tree + k-NN ranking pipeline.
                                    </p>
                                </div>
                            )}

                            {response && (
                                <div>
                                    <div className="results-header">
                                        <div>
                                            <h2 className="results-title">Ranked Destinations</h2>
                                            <div className="results-meta">
                                                Evaluated {response.totalCandidatesEvaluated} candidate nodes • Primary Decision Tree Category: <strong>{response.decisionTreePrimaryPrediction}</strong>
                                            </div>
                                        </div>
                                    </div>

                                    {response.recommendations && response.recommendations.length === 0 ? (
                                        <div className="glass-card empty-state">
                                            <div className="empty-icon">🔍</div>
                                            <h3>No Matching Destinations</h3>
                                            <p>No destination satisfied your constraints. Try increasing budget or adjusting trip duration.</p>
                                        </div>
                                    ) : (
                                        <div className="recommendation-list">
                                            {response.recommendations.map((rec) => (
                                                <div key={rec.rank} className={`recommendation-card rank-${rec.rank}`}>
                                                    <div className="card-top">
                                                        <div className="dest-title-group">
                                                            <span className="rank-pill">#{rec.rank}</span>
                                                            <div>
                                                                <span className="dest-name">{rec.destination}</span>
                                                                <span className="dest-province">({rec.province} Province)</span>
                                                            </div>
                                                        </div>
                                                        <div className="score-badge">
                                                            <span className="score-pct">{rec.matchPercentage}%</span>
                                                            <span className="score-label">Match Score</span>
                                                        </div>
                                                    </div>

                                                    {rec.suitabilityLabel && (
                                                        <div className={`suitability-badge badge-${rec.suitabilityLabel}`}>
                                                            <span>✓</span>
                                                            <span>{rec.suitabilityLabel.replace('_', ' ')}</span>
                                                        </div>
                                                    )}

                                                    <div className="reason-box">
                                                        {rec.reason}
                                                    </div>

                                                    <div className="specs-grid">
                                                        <div className="spec-item">
                                                            <span className="spec-label">Avg Daily Cost</span>
                                                            <span className="spec-value">${rec.averageDailyCost || 65}/day</span>
                                                        </div>
                                                        <div className="spec-item">
                                                            <span className="spec-label">Optimal Stay</span>
                                                            <span className="spec-value">{rec.minimumDays || 2} - {rec.maximumDays || 5} days</span>
                                                        </div>
                                                        <div className="spec-item">
                                                            <span className="spec-label">Difficulty</span>
                                                            <span className="spec-value">Level {rec.difficultyLevel || 3}/5</span>
                                                        </div>
                                                        <div className="spec-item">
                                                            <span className="spec-label">k-NN Peer Evidence</span>
                                                            <span className="spec-value">{(rec.knnEvidenceScore * 100).toFixed(0)}% support</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<TravelerRecommendationApp />);
    </script>
</body>
</html>
