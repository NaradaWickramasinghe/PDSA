<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Recommendation System — Task 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --radius: 8px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* App Header */
        .app-header {
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .app-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .app-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Main Layout Grid */
        .layout-grid {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Card Container */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .card-header-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Presets Section */
        .preset-section {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .preset-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-preset {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .btn-preset:hover {
            background-color: #e2e8f0;
            color: var(--text-primary);
            border-color: #cbd5e1;
        }

        /* Form Inputs */
        .form-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-control {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Slider Control */
        .slider-item {
            margin-bottom: 12px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .slider-title {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .slider-val {
            font-weight: 600;
            color: var(--primary-color);
            background-color: var(--primary-light);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        .range-slider {
            width: 100%;
            height: 5px;
            background: #e2e8f0;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* Primary Button */
        .btn-primary {
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: background-color 0.15s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* Recommendation Results List */
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .results-heading {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .results-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        .rec-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .rec-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .rec-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .rec-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-rank {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: #f1f5f9;
            color: var(--text-secondary);
        }

        .rec-card.rank-1 .badge-rank {
            background-color: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .rec-card.rank-2 .badge-rank {
            background-color: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .rec-card.rank-3 .badge-rank {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .rec-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .rec-province {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .match-badge {
            text-align: right;
        }

        .match-score {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1;
        }

        .match-text {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .suitability-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: #f1f5f9;
            color: var(--text-secondary);
        }

        .suitability-tag.EXCELLENT {
            background-color: #dcfce7;
            color: #166534;
        }

        .suitability-tag.SUITABLE {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .reason-text {
            font-size: 13px;
            color: var(--text-secondary);
            background-color: #f8fafc;
            border-left: 3px solid var(--primary-color);
            padding: 8px 12px;
            border-radius: 0 4px 4px 0;
            margin-bottom: 12px;
        }

        .specs-row {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }

        .spec-cell strong {
            color: var(--text-secondary);
        }

        /* Banner Messages */
        .alert-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .empty-box {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-box h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const PRESETS = [
            {
                label: "Beach & Relaxation",
                data: { budget: 1000, durationDays: 5, groupSize: 2, beach: 10, adventure: 4, nature: 6, culture: 3, nightlife: 7, relaxation: 9 }
            },
            {
                label: "Nature & Adventure",
                data: { budget: 700, durationDays: 4, groupSize: 2, beach: 2, adventure: 10, nature: 9, culture: 4, nightlife: 2, relaxation: 5 }
            },
            {
                label: "Cultural Explorer",
                data: { budget: 600, durationDays: 3, groupSize: 1, beach: 2, adventure: 4, nature: 5, culture: 10, nightlife: 3, relaxation: 6 }
            },
            {
                label: "Family Getaway",
                data: { budget: 1500, durationDays: 6, groupSize: 4, beach: 7, adventure: 5, nature: 8, culture: 6, nightlife: 3, relaxation: 8 }
            }
        ];

        function App() {
            const [formData, setFormData] = useState({
                budget: 800,
                durationDays: 5,
                groupSize: 2,
                beachPreference: 3,
                adventurePreference: 9,
                naturePreference: 8,
                culturePreference: 6,
                nightlifePreference: 4,
                relaxationPreference: 5
            });

            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [response, setResponse] = useState(null);

            const handleChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            const applyPreset = (preset) => {
                setFormData({
                    budget: preset.data.budget,
                    durationDays: preset.data.durationDays,
                    groupSize: preset.data.groupSize,
                    beachPreference: preset.data.beach,
                    adventurePreference: preset.data.adventure,
                    naturePreference: preset.data.nature,
                    culturePreference: preset.data.culture,
                    nightlifePreference: preset.data.nightlife,
                    relaxationPreference: preset.data.relaxation
                });
                setError(null);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);

                try {
                    const res = await fetch('/api/decisions/recommend', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({
                            budget: parseFloat(formData.budget),
                            durationDays: parseInt(formData.durationDays, 10),
                            groupSize: parseInt(formData.groupSize, 10),
                            beachPreference: parseInt(formData.beachPreference, 10),
                            adventurePreference: parseInt(formData.adventurePreference, 10),
                            naturePreference: parseInt(formData.naturePreference, 10),
                            culturePreference: parseInt(formData.culturePreference, 10),
                            nightlifePreference: parseInt(formData.nightlifePreference, 10),
                            relaxationPreference: parseInt(formData.relaxationPreference, 10),
                            topN: 5
                        })
                    });

                    const json = await res.json();

                    if (!res.ok || !json.success) {
                        throw new Error(json.message || `Error: ${res.status}`);
                    }

                    setResponse(json.data);
                } catch (err) {
                    setError(err.message || "Failed to reach recommendation service.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="container">
                    <header className="app-header">
                        <h1 className="app-title">Travel Recommendation System</h1>
                        <p className="app-subtitle">Task 4 — Personalized Destination Decision Engine</p>
                    </header>

                    <div className="layout-grid">
                        {/* Form Panel */}
                        <div className="card">
                            <div className="preset-section">
                                <div className="preset-label">Sample Presets</div>
                                <div className="preset-buttons">
                                    {PRESETS.map((p, idx) => (
                                        <button key={idx} type="button" className="btn-preset" onClick={() => applyPreset(p)}>
                                            {p.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <form onSubmit={handleSubmit}>
                                <div className="card-header-title" style={{ fontSize: '14px', marginBottom: '12px' }}>
                                    Trip Details
                                </div>

                                <div className="form-grid-3">
                                    <div className="form-group">
                                        <label className="form-label">Budget ($)</label>
                                        <input
                                            type="number"
                                            className="form-control"
                                            min="0"
                                            value={formData.budget}
                                            onChange={e => handleChange('budget', e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Days</label>
                                        <input
                                            type="number"
                                            className="form-control"
                                            min="1"
                                            max="14"
                                            value={formData.durationDays}
                                            onChange={e => handleChange('durationDays', e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Group</label>
                                        <input
                                            type="number"
                                            className="form-control"
                                            min="1"
                                            max="10"
                                            value={formData.groupSize}
                                            onChange={e => handleChange('groupSize', e.target.value)}
                                            required
                                        />
                                    </div>
                                </div>

                                <div className="card-header-title" style={{ fontSize: '14px', margin: '16px 0 12px' }}>
                                    Preferences (1 to 10)
                                </div>

                                {[
                                    { key: 'adventurePreference', label: 'Adventure' },
                                    { key: 'naturePreference', label: 'Nature' },
                                    { key: 'beachPreference', label: 'Beach' },
                                    { key: 'culturePreference', label: 'Culture' },
                                    { key: 'nightlifePreference', label: 'Nightlife' },
                                    { key: 'relaxationPreference', label: 'Relaxation' }
                                ].map(item => (
                                    <div className="slider-item" key={item.key}>
                                        <div className="slider-header">
                                            <span className="slider-title">{item.label}</span>
                                            <span className="slider-val">{formData[item.key]}</span>
                                        </div>
                                        <input
                                            type="range"
                                            className="range-slider"
                                            min="1"
                                            max="10"
                                            value={formData[item.key]}
                                            onChange={e => handleChange(item.key, e.target.value)}
                                        />
                                    </div>
                                ))}

                                <button type="submit" className="btn-primary" disabled={loading}>
                                    {loading ? 'Finding Recommendations...' : 'Find Recommendations'}
                                </button>
                            </form>
                        </div>

                        {/* Results Panel */}
                        <div>
                            {error && (
                                <div className="alert-error">
                                    {error}
                                </div>
                            )}

                            {!response && !loading && !error && (
                                <div className="card empty-box">
                                    <h3>No Recommendations Requested Yet</h3>
                                    <p>Select a sample preset or enter your trip details and click <strong>Find Recommendations</strong>.</p>
                                </div>
                            )}

                            {response && (
                                <div>
                                    <div className="results-header">
                                        <div>
                                            <h2 className="results-heading">Top Recommendations</h2>
                                            <div className="results-sub">
                                                Evaluated {response.totalCandidatesEvaluated} destinations • Category: <strong>{response.decisionTreePrimaryPrediction}</strong>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="rec-list">
                                        {response.recommendations.map((rec) => (
                                            <div key={rec.rank} className={`rec-card rank-${rec.rank}`}>
                                                <div className="rec-header">
                                                    <div className="rec-title-wrap">
                                                        <span className="badge-rank">#{rec.rank}</span>
                                                        <div>
                                                            <span className="rec-name">{rec.destination}</span>
                                                            <span className="rec-province"> — {rec.province} Province</span>
                                                        </div>
                                                    </div>
                                                    <div className="match-badge">
                                                        <span className="match-score">{rec.matchPercentage}%</span>
                                                        <div className="match-text">Match</div>
                                                    </div>
                                                </div>

                                                {rec.suitabilityLabel && (
                                                    <span className={`suitability-tag ${rec.suitabilityLabel}`}>
                                                        {rec.suitabilityLabel.replace('_', ' ')}
                                                    </span>
                                                )}

                                                <div className="reason-text">
                                                    {rec.reason}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
