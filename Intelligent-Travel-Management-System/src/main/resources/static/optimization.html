<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Optimization</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f6fb;
        margin: 0;
        padding: 24px;
        color: #243b53;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 16px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
      }
      button {
        background: #2563eb;
        border: none;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      #result {
        margin-top: 24px;
        padding: 20px;
        border-radius: 10px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(160px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .stat {
        background: white;
        border: 1px solid #dbeafe;
        border-radius: 8px;
        padding: 12px;
      }
      .route {
        margin-top: 12px;
        font-weight: 600;
      }
      .error {
        color: #b91c1c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Intelligent Travel Optimization</h2>
      <div class="row">
        <div>
          <label>Origin</label>
          <select id="origin">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="F">F</option>
          </select>
        </div>
        <div>
          <label>Destination</label>
          <select id="destination">
            <option value="F">F</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
        </div>
        <div>
          <label>Max Travel Time</label>
          <input id="maxTravelTime" type="number" value="220" min="1" />
        </div>
        <div>
          <label>Max Budget</label>
          <input id="maxBudget" type="number" value="140" min="1" />
        </div>
        <div>
          <label>Optimization Method</label>
          <select id="optimizationMethod">
            <option value="BRANCH_AND_BOUND">Branch and Bound</option>
            <option value="GENETIC_ALGORITHM">Genetic Algorithm</option>
            <option value="PARETO_FRONTIER">Pareto Frontier</option>
            <option value="BENCHMARK">Benchmark All</option>
          </select>
        </div>
        <div>
          <label>Distance Weight</label>
          <input id="distanceWeight" type="number" value="0.45" step="0.05" />
        </div>
        <div>
          <label>Time Weight</label>
          <input id="timeWeight" type="number" value="0.35" step="0.05" />
        </div>
        <div>
          <label>Cost Weight</label>
          <input id="costWeight" type="number" value="0.20" step="0.05" />
        </div>
      </div>
      <div style="margin-top: 18px">
        <button id="optimizeBtn">Optimize Route</button>
      </div>
      <div id="result">
        <p>Choose a route and run optimization.</p>
      </div>
    </div>

    <script>
      const resultPanel = document.getElementById("result");
      const optimizeBtn = document.getElementById("optimizeBtn");

      optimizeBtn.addEventListener("click", async () => {
        const payload = {
          origin: document.getElementById("origin").value,
          destination: document.getElementById("destination").value,
          maxTravelTime: Number(document.getElementById("maxTravelTime").value),
          maxBudget: Number(document.getElementById("maxBudget").value),
          optimizationMethod:
            document.getElementById("optimizationMethod").value,
          objectiveWeights: {
            distanceWeight: Number(
              document.getElementById("distanceWeight").value,
            ),
            timeWeight: Number(document.getElementById("timeWeight").value),
            costWeight: Number(document.getElementById("costWeight").value),
          },
        };

        resultPanel.innerHTML = "<p>Running optimization...</p>";
        try {
          const response = await fetch("/api/optimization/route", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok || !data.success) {
            resultPanel.innerHTML =
              '<div class="error">' +
              (data.errorMessage || "No feasible route found.") +
              "</div>";
            return;
          }
          resultPanel.innerHTML = `
                    <div class="route">Route: ${data.route.join(" → ")}</div>
                    <div class="stats">
                        <div class="stat"><strong>Method</strong><br>${data.selectedAlgorithm}</div>
                        <div class="stat"><strong>Distance</strong><br>${data.totalDistance.toFixed(2)}</div>
                        <div class="stat"><strong>Travel Time</strong><br>${data.totalTravelTime.toFixed(2)}</div>
                        <div class="stat"><strong>Cost</strong><br>${data.totalCost.toFixed(2)}</div>
                        <div class="stat"><strong>Score</strong><br>${data.objectiveScore.toFixed(2)}</div>
                        <div class="stat"><strong>Execution</strong><br>${data.executionTimeMs} ms</div>
                    </div>
                `;
        } catch (error) {
          resultPanel.innerHTML =
            '<div class="error">Failed to connect to the optimization API.</div>';
        }
      });
    </script>
  </body>
</html>
