spring.application.name=Intelligent-Travel-Management-System
server.port=${PORT:8080}

# Supabase PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.yfiqrjkhfcjypzxracom}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rbEm43GGcL3JdtFd}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool (Restricted to 3 connections to prevent Supabase pool limit)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=2000000

# Hibernate Dialect & Schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway (disabled - using ddl-auto=update instead)
spring.flyway.enabled=false

# Module 4 Ranking Weights & Parameters
module4.ranking.weights.tree=0.35
module4.ranking.weights.knn=0.25
module4.ranking.weights.preference=0.30
module4.ranking.weights.penalty=0.10
module4.knn.k=5
module4.recommendation.default-top-n=5
# spring.flyway.locations=classpath:db/migration
# Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.yfiqrjkhfcjypzxracom
spring.datasource.password=rbEm43GGcL3JdtFd
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
