# ==============================================================================
# Local In-Memory Development Profile
# Starts instantly with zero database installation required
# ==============================================================================
spring.application.name=intelligent-travel-system-local
server.port=${PORT:8085}

spring.datasource.url=jdbc:h2:mem:travelsystem;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway disabled in local in-memory H2 profile
spring.flyway.enabled=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Module 4 Ranking Weights & Parameters
module4.ranking.weights.tree=0.35
module4.ranking.weights.knn=0.25
module4.ranking.weights.preference=0.30
module4.ranking.weights.penalty=0.10
module4.knn.k=5
module4.recommendation.default-top-n=5
